services:
  - type: web
    name: frenbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python frenbot.py --bot
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: OTP_WEBHOOK_SECRET
        sync: false
      - key: SESSION_JSON
        sync: false
